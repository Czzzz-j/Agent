[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-project"
version = "0.1.0"
description = "Furniture agent with LangGraph, layered memory, RAG, and outbox workers."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.136,<0.137",
  "uvicorn[standard]>=0.44,<0.45",
  "streamlit>=1.56,<1.57",
  "requests>=2.33,<3",
  "PyYAML>=6.0.3,<7",
  "python-dotenv>=1.2,<2",
  "python-multipart>=0.0.29,<1",
  "PyPDF2>=3.0.1,<4",
  "mysql-connector-python>=9.7,<10",
  "PyMySQL>=1.2,<2",
  "redis>=7.4,<8",
  "chromadb>=1.5,<2",
  "dashscope>=1.25,<2",
  "jieba>=0.42.1,<0.43",
  "rank-bm25>=0.2.2,<0.3",
  "langchain>=1.2,<2",
  "langchain-core>=1.3,<2",
  "langchain-community>=0.4,<1",
  "langchain-chroma>=1.1,<2",
  "langgraph>=1.1,<1.2",
  "sentence-transformers>=5.4,<6",
  "torch>=2.12,<3",
  "transformers>=5.7,<6",
  "huggingface-hub>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.uv]
package = false

